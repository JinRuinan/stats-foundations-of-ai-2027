<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Statistical Foundations of AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background:
        radial-gradient(90% 80% at 80% 10%, rgba(47, 126, 122, 0.35), transparent 55%),
        radial-gradient(70% 60% at 10% 90%, rgba(217, 164, 65, 0.16), transparent 60%),
        var(--ink);
      color: var(--paper);
      text-align: center;
    }
    .error-page .brand__mark { width: 56px; height: 56px; margin: 0 auto 24px; }
    .error-page h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); margin-bottom: 16px; }
    .error-page p { color: var(--muted-light); max-width: 44ch; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="11" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1.5"/>
        <text x="24" y="33.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="currentColor">Σ</text>
      </svg>
      <p class="eyebrow eyebrow--light">404</p>
      <h1>Page not found.</h1>
      <p>The page you are looking for does not exist. Return to the workshop homepage for dates, speakers, venue and travel information.</p>
      <a class="btn btn--solid" href="./">Back to the workshop</a>
    </div>
  </main>
</body>
</html>
